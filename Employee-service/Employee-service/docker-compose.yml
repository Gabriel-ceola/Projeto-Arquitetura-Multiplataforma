services:
  employee-service:
    container_name: employee-service-db
    image: postgres:12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employee_service
    # 5432 já é usada pelo banco do Dentist-service e 5433 pelo banco do Keycloak
    ports:
      - "5434:5432"
    volumes:
      - employee_postgres_data:/var/lib/postgresql/data

volumes:
  employee_postgres_data:
