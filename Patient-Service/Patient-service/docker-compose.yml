services:
  patient-service:
    container_name: patient-service-db
    image: postgres:12
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patient_service
    # 5432 (Dentist), 5433 (Payment), 5434 (Employee) e 5435 (Keycloak) já estão em uso
    ports:
      - "5437:5432"
    volumes:
      - patient_postgres_data:/var/lib/postgresql/data

volumes:
  patient_postgres_data:
