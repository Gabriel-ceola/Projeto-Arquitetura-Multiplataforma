# Pipeline dos logs da Odontologia Integrada.
# Entrada: eventos JSON (ECS) enviados pelo Filebeat.
# Saída: data streams logs-<servico>-dev no Elasticsearch.

input {
  beats {
    port => 5044
  }
}

filter {
  # 1. Serviço de origem: vem do próprio log (service.name) ou da dica do Filebeat.
  if ![service][name] and [service_hint] {
    mutate { add_field => { "[service][name]" => "%{[service_hint]}" } }
  }
  if ![service][name] {
    mutate { add_field => { "[service][name]" => "unknown" } }
  }
  mutate { remove_field => [ "service_hint" ] }

  # 2. Correlation id: aceita variações de nome e padroniza em labels.correlation_id.
  if [correlationId] {
    mutate { rename => { "[correlationId]" => "[labels][correlation_id]" } }
  }
  if [correlation_id] {
    mutate { rename => { "[correlation_id]" => "[labels][correlation_id]" } }
  }

  # 3. Health checks não agregam valor aos logs.
  if [url][path] =~ /^\/health/ {
    drop { }
  }

  # 4. LGPD (defesa em profundidade): mascara CPF, e-mail e bearer token.
  mutate {
    gsub => [
      "message", "\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b", "[REDACTED]",
      "message", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "[REDACTED]",
      "message", "(?i)bearer\s+[A-Za-z0-9\-._~+/]+=*", "Bearer [REDACTED]",
      "[error][message]", "\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b", "[REDACTED]",
      "[error][message]", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "[REDACTED]",
      "[error][stack_trace]", "(?i)bearer\s+[A-Za-z0-9\-._~+/]+=*", "Bearer [REDACTED]"
    ]
  }

  # 5. Roteamento para o data stream: logs-<servico>-dev (sem hífen no dataset).
  mutate { add_field => { "[data_stream][dataset]" => "%{[service][name]}" } }
  mutate { gsub => [ "[data_stream][dataset]", "[^A-Za-z0-9]", "_" ] }
  mutate { lowercase => [ "[data_stream][dataset]" ] }
  mutate {
    add_field => {
      "[data_stream][type]" => "logs"
      "[data_stream][namespace]" => "dev"
      "[event][dataset]" => "%{[data_stream][dataset]}"
    }
  }

  # 6. Remove metadados do Filebeat sem utilidade.
  mutate { remove_field => [ "agent", "input", "host", "tags" ] }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    data_stream => true
  }
}
