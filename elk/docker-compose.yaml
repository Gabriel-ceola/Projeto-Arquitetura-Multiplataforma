# Stack ELK para logs da Odontologia Integrada.
# Fluxo: apps (host) -> logs/*.json -> Filebeat -> Logstash -> Elasticsearch -> Kibana
# Subir: docker compose up -d   (a partir de elk/)
name: odontologia-elk

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.17.4}
    container_name: elasticsearch
    environment:
      cluster.name: odontologia-logs
      discovery.type: single-node
      # Dev: segurança desativada (ver elk/README.md para produção).
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null || exit 1']
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [elk]

  # Job único: cria política ILM e index template (idempotente).
  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.17.4}
    container_name: es-setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ES_URL: http://elasticsearch:9200
    volumes:
      - ./elasticsearch:/setup:ro
    command: ["bash", "/setup/setup.sh"]
    restart: "no"
    networks: [elk]

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-8.17.4}
    container_name: logstash
    depends_on:
      es-setup:
        condition: service_completed_successfully
    environment:
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms512m -Xmx512m}
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    # Porta 5044 só na rede interna: apenas o Filebeat envia para cá.
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:9600/_node/pipelines >/dev/null || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [elk]

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELK_VERSION:-8.17.4}
    container_name: filebeat
    user: root
    depends_on:
      logstash:
        condition: service_healthy
    # strict.perms=false: bind mount do Windows não preserva permissões do filebeat.yml.
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Logs gravados pelos serviços no host (somente leitura).
      - ${LOGS_DIR:-../logs}:/var/log/odonto:ro
      # Registry com os offsets: evita reenviar/perder linhas ao reiniciar.
      - filebeat-data:/usr/share/filebeat/data
    networks: [elk]

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.17.4}
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_OPTIN: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:5601/api/status | grep -q "\"level\":\"available\"" || exit 1']
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 40s
    networks: [elk]

  # Job único: cria data view e importa buscas/dashboards salvos.
  kibana-setup:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.17.4}
    container_name: kibana-setup
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      KIBANA_URL: http://kibana:5601
    volumes:
      - ./kibana:/setup:ro
    command: ["bash", "/setup/setup.sh"]
    restart: "no"
    networks: [elk]

volumes:
  es-data:
  filebeat-data:

networks:
  elk:
    name: odontologia-elk-network
