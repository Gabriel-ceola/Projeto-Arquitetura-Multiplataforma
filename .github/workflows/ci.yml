name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  bff:
    name: BFF (lint, arch, unit, int, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Arch check
        run: pnpm run arch:check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Integration tests
        run: pnpm run test:int

      - name: Build
        run: pnpm run build

  messaging:
    name: Messaging (build & test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Messaging/Messaging.sln

      - name: Build
        run: dotnet build Messaging/Messaging.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Messaging/Messaging.Tests/Messaging.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=messaging-test-results.trx"
          --results-directory ./messaging-test-results

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Messaging xUnit Tests
          path: messaging-test-results/*.trx
          reporter: dotnet-trx

  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Dentist-Service/Dentist-service.sln

      - name: Build
        run: dotnet build Dentist-Service/Dentist-service.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Dentist-Service/Dentist-service.Tests/Dentist-service.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./test-results

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit Tests
          path: test-results/*.trx
          reporter: dotnet-trx

  employee-service:
    name: Employee Service (build & test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Employee-service/Employee-service.sln

      - name: Build
        run: dotnet build Employee-service/Employee-service.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test Employee-service/Employee-service.Tests/Employee-service.Tests.csproj
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=employee-test-results.trx"
          --results-directory ./employee-test-results

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Employee Service xUnit Tests
          path: employee-test-results/*.trx
          reporter: dotnet-trx

  patient-service:
    name: Patient Service (build & test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Patient-Service/Patient-service.sln

      - name: Build
        run: dotnet build Patient-Service/Patient-service.sln --no-restore --configuration Release

      - name: Test
