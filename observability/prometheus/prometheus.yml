global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    monitor: odontologia

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # APIs .NET rodam no host — alcançadas via host.docker.internal (host-gateway).
  - job_name: dentist-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5068"]
        labels:
          service: dentist-service

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:5127"]
        labels:
          service: payment-service

  - job_name: bff
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: bff

  # Métricas do broker Kafka (lag por grupo/tópico/partição).
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
