name: odontologia-observability

# Stack de observabilidade do fluxo de agendamento e pagamento.
#
# As aplicações (.NET e BFF) rodam no HOST, então o Prometheus as alcança via
# `host.docker.internal`. Em Linux, o mapeamento é garantido por `host-gateway`.
# Suba as apps escutando em todas as interfaces, por exemplo:
#   ASPNETCORE_URLS=http://0.0.0.0:5068 dotnet run
#
# Uso: docker compose -f observability/docker-compose.yaml up -d

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: odontologia-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      # O sufixo `z` re-rotula os arquivos para uso em hosts com SELinux (ex.: Fedora).
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus/rules:/etc/prometheus/rules:ro,z
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - odontologia
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    container_name: odontologia-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - odontologia
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: odontologia-kafka-exporter
    command:
      - --kafka.server=kafka:19092
    ports:
      - "9308:9308"
    networks:
      - odontologia
    restart: unless-stopped

networks:
  odontologia:
    name: odontologia-network

volumes:
  prometheus-data:
  grafana-data:
